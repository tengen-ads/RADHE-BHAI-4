<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Telegram</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
text-align:center;
padding:25px;
}

.profile{
width:170px;
height:170px;
margin:20px auto;
border-radius:50%;
overflow:hidden;
border:4px solid #FFD700;
box-shadow:
0 0 15px #FFD700,
0 0 35px #FFD700,
0 0 60px #FFD700;
}

.profile img{
width:100%;
height:100%;
object-fit:cover;
}

h1{
font-size:38px;
margin-top:20px;
font-weight:bold;
}

.subtitle{
font-size:28px;
color:#FFD700;
margin-top:15px;
font-weight:700;
}

.desc{
font-size:20px;
color:#ddd;
margin-top:20px;
line-height:1.5;
}

.join-btn{
display:block;
width:100%;
max-width:420px;
margin:35px auto;
padding:22px;
background:#FFD700;
color:black;
font-size:28px;
font-weight:bold;
border:none;
border-radius:20px;
text-decoration:none;
box-shadow:
0 0 15px #FFD700,
0 0 40px #FFD700;
}

.offer-box{
max-width:500px;
margin:auto;
padding:25px;
border-radius:25px;
border:3px solid #FFD700;
box-shadow:
0 0 15px #FFD700,
0 0 40px rgba(255,215,0,.6);
}

.offer-title{
font-size:28px;
font-weight:bold;
color:#FFD700;
margin-bottom:30px;
}

.timer{
display:flex;
justify-content:center;
gap:20px;
}

.time-box{
width:120px;
height:120px;
border:3px solid #FFD700;
border-radius:20px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-shadow:0 0 20px #FFD700;
}

.number{
font-size:50px;
font-weight:bold;
}

.label{
font-size:18px;
color:#ccc;
}

.footer{
margin-top:40px;
color:#999;
font-size:18px;
}
</style>
</head>

<body>

<div class="profile">
<img src="https://www.image2url.com/r2/default/images/1780159457443-cf78c78d-046d-4c57-86fd-dda6f94572b0.png">
</div>

<h1>𝐑𝐀𝐃𝐇𝐄 𝐗 𝐄𝐌𝐏𝐈𝐑𝐄 🥷</h1>

<div class="subtitle">
Premium Signals & Insights 🔥
</div>

<div class="desc">
Join our exclusive Telegram community for daily updates, signals & market insights.
</div>

<a class="join-btn"
href="https://t.me/+0P9Ath5bL3Q2Mjll"
target="_blank">
🚀 JOIN TELEGRAM NOW
</a>

<div class="offer-box">

<div class="offer-title">
⚡ Limited Offer Ends In ⚡
</div>

<div class="timer">

<div class="time-box">
<div class="number">00</div>
<div class="label">Min</div>
</div>

<div class="time-box">
<div class="number" id="sec">59</div>
<div class="label">Sec</div>
</div>

</div>

</div>

<div class="footer">
Managed by @TENGENADSAGENCY
</div>

<script>
let sec = 59;

setInterval(()=>{
sec--;

if(sec < 0){
sec = 59;
}

document.getElementById("sec").innerText =
sec.toString().padStart(2,"0");

},1000);
</script>

</body>
</html>
